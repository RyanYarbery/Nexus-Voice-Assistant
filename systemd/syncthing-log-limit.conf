# Installed on nexus as ~ryan/.config/systemd/user/syncthing.service.d/10-log-limit.conf
# Syncthing once wrote 254,800 journal lines in 19 hours and pushed Nexus's wake
# history out of the 250 MB journal in under a day (review 2026-11-18). This caps
# it at 200 lines per 30 s; normal use is about 20 lines per hour.
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
