name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tests need no microphone, speaker, model or account.
      - run: pip install numpy scipy pytest ruff
      - run: ruff check --select F,E9 .
      - run: python -m pytest
